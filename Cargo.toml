[workspace]
members = ["src-tauri", "src-cli"]
resolver = "2"

# Shared settings for all workspace members
[workspace.package]
edition = "2021"
license = "MIT"

# Release profile for optimized builds
[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# QueryPilot agent CLI specific release profile
[profile.release.package.querypilot]
strip = true
