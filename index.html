<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Query Pilot</title>
  <script>
    (function () {
      const storageKey = 'query-pilot-theme';
      const savedTheme = localStorage.getItem(storageKey);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');

      if (theme === 'dark' || (theme === 'system' && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <style>
    :root {
      --loader-bg: 36 33% 97%;
      --loader-fg: 33 13% 14%;
      --loader-border: 34 12% 79%;
      --loader-primary: 43 70% 50%;
      --loader-muted: 39 6% 45%;
    }

    .dark {
      --loader-bg: 33 13% 14%;
      --loader-fg: 36 21% 91%;
      --loader-border: 36 5% 34%;
      --loader-primary: 43 70% 50%;
      --loader-muted: 39 6% 55%;
    }

    #root-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: hsl(var(--loader-bg));
      color: hsl(var(--loader-fg));
    }

    #root-loader img {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      margin-bottom: 24px;
    }

    #root-loader .spinner {
      width: 27px;
      height: 27px;
      min-width: 27px;
      min-height: 27px;
      border: 3px solid hsl(var(--loader-border));
      border-top-color: hsl(var(--loader-primary));
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    #root-loader .text {
      color: hsl(var(--loader-muted));
      font-size: 14px;
      font-family: Noto Sans, system-ui, -apple-system, sans-serif;
      font-weight: 400;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    body {
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="root-loader">
      <img src="/logo.png" alt="Query Pilot" />
      <div class="spinner"></div>
      <div class="text">Initializing vault…</div>
    </div>
  </div>
  <div id="portal"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
