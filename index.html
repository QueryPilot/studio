<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Query Pilot</title>
  <script>
    (function () {
      const storageKey = 'query-pilot-theme';
      const savedTheme = localStorage.getItem(storageKey);
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const theme = savedTheme || (prefersDark ? 'dark' : 'light');

      if (theme === 'dark' || (theme === 'system' && prefersDark)) {
        document.documentElement.classList.add('dark');
      }
    })();
  </script>
  <style>
    :root {
      --loader-bg: oklch(0.95 0.02 75 / 0.35);
      --loader-fg: oklch(0.17 0.008 75);
      --loader-border: oklch(0.88 0.012 78);
      --loader-primary: oklch(0.75 0.16 70);
      --loader-muted: oklch(0.52 0.012 75);
    }

    .dark {
      --loader-bg: oklch(0.15 0.02 70 / 0.4);
      --loader-fg: oklch(0.93 0.008 75);
      --loader-border: oklch(0.32 0.015 75);
      --loader-primary: oklch(0.75 0.16 70);
      --loader-muted: oklch(0.65 0.01 75);
    }

    /* Vibrancy mismatch: dark app on light system */
    @media (prefers-color-scheme: light) {
      .dark {
        --loader-bg: oklch(0.12 0.02 70 / 0.92);
      }
    }
    /* Vibrancy mismatch: light app on dark system */
    @media (prefers-color-scheme: dark) {
      :root:not(.dark) {
        --loader-bg: oklch(0.96 0.02 75 / 0.92);
      }
    }

    #root-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: var(--loader-bg);
      color: var(--loader-fg);
    }

    #root-loader img {
      width: 80px;
      height: 80px;
      border-radius: 16px;
      margin-bottom: 24px;
    }

    #root-loader .spinner {
      width: 27px;
      height: 27px;
      min-width: 27px;
      min-height: 27px;
      border: 3px solid var(--loader-border);
      border-top-color: var(--loader-primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 12px;
    }

    #root-loader .text {
      color: var(--loader-muted);
      font-size: 14px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", sans-serif;
      font-weight: 400;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    body {
      margin: 0;
      padding: 0;
    }
  </style>
</head>

<body>
  <div id="root">
    <div id="root-loader">
      <img src="/logo.png" alt="Query Pilot" />
      <div class="spinner"></div>
      <div class="text">Initializing vault…</div>
    </div>
  </div>
  <div id="portal"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
