version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: query-pilot-postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: devuser
      POSTGRES_PASSWORD: devpass123
      POSTGRES_DB: todoapp
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./seeds/postgres:/docker-entrypoint-initdb.d
    networks:
      - query-pilot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devuser -d todoapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  mysql:
    image: mysql:8.3
    container_name: query-pilot-mysql
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass123
      MYSQL_DATABASE: todoapp
    volumes:
      - mysql_data:/var/lib/mysql
      - ./seeds/mysql:/docker-entrypoint-initdb.d
    networks:
      - query-pilot-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mariadb:
    image: mariadb:11
    container_name: query-pilot-mariadb
    ports:
      - "13307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_USER: devuser
      MYSQL_PASSWORD: devpass123
      MYSQL_DATABASE: todoapp
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./seeds/mysql:/docker-entrypoint-initdb.d
    networks:
      - query-pilot-network
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect"]
      interval: 10s
      timeout: 5s
      retries: 5

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2019-latest
    platform: linux/amd64
    container_name: query-pilot-sqlserver
    ports:
      - "11434:1433"
    environment:
      MSSQL_SA_PASSWORD: "DevPass123"
      SA_PASSWORD: "DevPass123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    volumes:
      - sqlserver_data:/var/opt/mssql
      - ./seeds/sqlserver:/seeds
    networks:
      - query-pilot-network
    healthcheck:
      test:
        [
          "CMD",
          "/opt/mssql-tools18/bin/sqlcmd",
          "-S",
          "localhost",
          "-U",
          "sa",
          "-P",
          "DevPass123",
          "-Q",
          "SELECT 1",
          "-C",
        ]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  mongodb:
    image: mongo:7.0
    container_name: query-pilot-mongodb
    ports:
      - "17017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: devuser
      MONGO_INITDB_ROOT_PASSWORD: devpass123
      MONGO_INITDB_DATABASE: todoapp
    volumes:
      - mongodb_data:/data/db
      - ./seeds/mongodb:/docker-entrypoint-initdb.d:ro
    networks:
      - query-pilot-network
    healthcheck:
      test: ["CMD", "mongosh", "-u", "devuser", "-p", "devpass123", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: query-pilot-redis
    ports:
      - "16379:6379"
    command: redis-server --requirepass devpass123
    volumes:
      - redis_data:/data
    networks:
      - query-pilot-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "devpass123", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  oracle:
    image: gvenzl/oracle-xe:21-slim-faststart
    container_name: query-pilot-oracle
    ports:
      - "11521:1521"
    environment:
      ORACLE_PASSWORD: DevPass123
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./seeds/oracle:/seeds
    networks:
      - query-pilot-network
    healthcheck:
      test: ["CMD", "sqlplus", "-s", "system/DevPass123@//localhost:1521/XE", "<<<", "SELECT 1 FROM DUAL;"]
      interval: 30s
      timeout: 10s
      retries: 10

