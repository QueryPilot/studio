name: Release Build

on:
  # workflow_dispatch: # Manual triggering only (disabled auto-trigger)
  #   inputs:
  #     tag:
  #       description: "Release tag (e.g., v1.0.0)"
  #       required: true
  #       type: string
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write # Required for creating releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Don't cancel release builds

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          PRERELEASE=""
          if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]]; then
            PRERELEASE="--prerelease"
          fi

          gh release create "$VERSION" \
            --draft \
            $PRERELEASE \
            --title "Query Pilot $VERSION" \
            --notes "## 🚀 Query Pilot $VERSION

          ### What's New
          <!-- Add release notes here -->

          ### 📦 Installation

          **macOS**
          - Apple Silicon: Download \`Query-Pilot_aarch64.dmg\`
          - Open DMG and drag Query Pilot to Applications
          - Note: Intel build temporarily unavailable

          ### ⚠️ Code Signing
          - **macOS**: Signed and notarized with Apple Developer ID

          ### 📝 Full Changelog
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)"

  build-release:
    name: Build (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            arch: aarch64
          # Temporarily disabled - uncomment to build Intel version
          # - os: macos-latest
          #   platform: macos
          #   target: x86_64-apple-darwin
          #   arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install macOS Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-rust-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-
            ${{ runner.os }}-rust-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('src-tauri/sidecar-ai/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AI sidecar
        run: |
          echo "Building AI sidecar for ${{ matrix.target }}..."
          pnpm build:ai-sidecar

          # Verify the sidecar was built
          echo "Checking for built sidecar..."
          ls -la src-tauri/sidecars/ || echo "Sidecars directory not found!"

          EXPECTED_FILE="src-tauri/sidecars/ai-server-${{ matrix.target }}"
          echo "Tauri expects: $EXPECTED_FILE"

          if [ ! -f "$EXPECTED_FILE" ]; then
            echo "ERROR: Sidecar binary not found!"
            exit 1
          fi

          echo "✅ Sidecar built successfully"
        shell: bash

      # ============================================
      # macOS Code Signing & Notarization Setup
      # ============================================

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: temporary_build_keychain_password
        run: |
          # Create temporary keychain with password
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Decode and import certificate
          echo $APPLE_CERTIFICATE | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P $APPLE_CERTIFICATE_PASSWORD -T /usr/bin/codesign

          # Allow codesigning to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Verify certificate was imported
          security find-identity -v -p codesigning build.keychain

          # Clean up
          rm certificate.p12

      # ============================================
      # Build Tauri App
      # ============================================

      - name: Build Tauri app (macOS with signing)
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          APPLE_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.APPLE_CERTIFICATE }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          pnpm tauri build --target ${{ matrix.target }}

      - name: Cleanup macOS keychain
        if: always()
        run: security delete-keychain build.keychain || true

      # ============================================
      # Upload Artifacts to Release
      # ============================================

      - name: Find and upload macOS DMG
        run: |
          echo "🔍 Searching for DMG files..."
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f -name "*.dmg" || echo "No DMG files found"

          DMG_PATH=$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -n "$DMG_PATH" ]; then
            DMG_NAME="Query-Pilot_${{ matrix.arch }}.dmg"
            echo "📦 Found DMG: $DMG_PATH"
            echo "📤 Renaming to: $DMG_NAME"
            mv "$DMG_PATH" "$DMG_NAME"

            echo "🚀 Uploading to release: ${{ needs.create-release.outputs.version }}"
            gh release upload ${{ needs.create-release.outputs.version }} \
              "$DMG_NAME" \
              --clobber

            echo "✅ Uploaded: $DMG_NAME"
          else
            echo "❌ ERROR: No DMG file found!"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 3

  finalize-release:
    name: Finalize Release
    needs: [create-release, build-release]
    runs-on: ubuntu-latest

    steps:
      - name: Update release status
        run: |
          echo "🎉 All builds completed successfully!"
          echo ""
          echo "Release: ${{ needs.create-release.outputs.version }}"
          echo "Draft release created - review and publish at:"
          echo "https://github.com/${{ github.repository }}/releases"
