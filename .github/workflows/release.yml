name: Release Build (Enhanced with Updater)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version to release (e.g. v2026.1.0 or v2026.1.0-beta.1)"
        required: true
        type: string
      publish_to_app_repo:
        description: "Publish to QueryPilot/QueryPilot?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # Required for creating releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Don't cancel release builds

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0 # Full history needed for changelog generation from commits

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Delete existing release with same tag if exists
          if gh release view "$VERSION" &> /dev/null; then
            echo "🗑️ Deleting existing release $VERSION..."
            gh release delete "$VERSION" --yes
          fi

          VERSION_NUMBER="${VERSION#v}"

          # Extract changelog for this version only (stop at next version header)
          CHANGELOG_CONTENT=$(awk "/^## \[$VERSION_NUMBER\]/{found=1;next} found && /^## \[/{exit} found" CHANGELOG.md || true)

          # Fallback: generate changelog from git commits between tags
          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "⚠️ No changelog entry found for $VERSION_NUMBER in CHANGELOG.md"
            echo "📝 Generating release notes from git commits..."

            # Find the previous tag
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -n 1 || true)

            if [ -n "$PREV_TAG" ]; then
              COMMIT_RANGE="${PREV_TAG}..${VERSION}"
            else
              COMMIT_RANGE="${VERSION}"
            fi

            # Generate categorized changelog from conventional commits
            FEATURES=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges --grep="^feat" 2>/dev/null || true)
            FIXES=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges --grep="^fix" 2>/dev/null || true)
            OTHER=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges --grep="^chore\|^refactor\|^perf\|^docs\|^style\|^ci" 2>/dev/null || true)

            # If conventional commits didn't match, list all commits
            if [ -z "$FEATURES" ] && [ -z "$FIXES" ] && [ -z "$OTHER" ]; then
              CHANGELOG_CONTENT=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges 2>/dev/null | head -30 || true)
            else
              CHANGELOG_CONTENT=""
              if [ -n "$FEATURES" ]; then
                CHANGELOG_CONTENT="### New Features
          ${FEATURES}
          "
              fi
              if [ -n "$FIXES" ]; then
                CHANGELOG_CONTENT="${CHANGELOG_CONTENT}
          ### Bug Fixes
          ${FIXES}
          "
              fi
              if [ -n "$OTHER" ]; then
                CHANGELOG_CONTENT="${CHANGELOG_CONTENT}
          ### Other Changes
          ${OTHER}"
              fi
            fi
          fi

          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="No notable changes in this release."
          fi

          # Create release notes (changelog only)
          echo "## What's Changed" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "$CHANGELOG_CONTENT" >> /tmp/release-notes.md

          gh release create "$VERSION" \
            --draft \
            --title "Query Pilot $VERSION" \
            --notes-file /tmp/release-notes.md

  build-release:
    name: Build (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            platform: macos
            target: aarch64-apple-darwin
            arch: aarch64
          - os: macos-26
            platform: macos
            target: x86_64-apple-darwin
            arch: x86_64

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: true
          cache-all-crates: true
          shared-key: "release-${{ matrix.target }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ============================================
      # macOS Code Signing & Notarization Setup
      # ============================================

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: temporary_build_keychain_password
        run: |
          # Create temporary keychain with password
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Decode and import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign

          # Allow codesigning to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Verify certificate was imported
          security find-identity -v -p codesigning build.keychain

          # Clean up
          rm certificate.p12

      # ============================================
      # Build querypilot CLI (required by externalBin)
      # ============================================

      - name: Build querypilot CLI
        run: |
          TARGET="${{ matrix.target }}"
          mkdir -p target/release

          cargo build --release --package querypilot --target "$TARGET"
          install -m 755 "target/$TARGET/release/querypilot" "target/release/querypilot-$TARGET"

          EXPECTED_PATH="target/release/querypilot-$TARGET"
          if [ ! -f "$EXPECTED_PATH" ]; then
            echo "❌ ERROR: Missing querypilot CLI artifact: $EXPECTED_PATH"
            exit 1
          fi
          if [ ! -x "$EXPECTED_PATH" ]; then
            echo "❌ ERROR: querypilot CLI is not executable: $EXPECTED_PATH"
            exit 1
          fi

          SMOKE_REQUEST='{"version":"1","requestId":"ci-smoke","params":{}}'
          printf '%s' "$SMOKE_REQUEST" \
            | "$EXPECTED_PATH" agent workspace.listTabs \
            | python3 -c 'import json,sys; o=json.load(sys.stdin); assert o.get("ok") is True; assert o.get("requestId")=="ci-smoke"; assert o.get("capability")=="workspace.listTabs"'

          ls -la target/release/querypilot*
          echo "✅ querypilot CLI built for $TARGET"

      # ============================================
      # Build Tauri App
      # ============================================

      - name: Build Tauri app (macOS with signing)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_DISABLE_SOURCEMAPS: "true"
          APPLE_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Sentry Configuration (optional - only used if secrets are set)
          # Single DSN for all components (Frontend, Backend, Sidecar)
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # SENTRY_AUTH_TOKEN disabled - source maps upload causes OOM on M1 runners
          # SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'query-pilot' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'query-pilot' }}
        shell: bash
        run: |
          # Build frontend with Sentry source maps (if SENTRY_AUTH_TOKEN is set)
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "🔍 Sentry configured - source maps will be uploaded"
          else
            echo "⚠️  Sentry not configured - telemetry disabled"
          fi

          # Build Tauri with telemetry feature if Sentry DSN is configured
          if [ -n "$SENTRY_DSN" ]; then
            echo "🚀 Building with telemetry feature enabled"
            pnpm tauri build --target ${{ matrix.target }} -- --features telemetry
          else
            echo "🚀 Building without telemetry"
            pnpm tauri build --target ${{ matrix.target }}
          fi

      - name: Cleanup macOS keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f certificate.p12 || true

      # ============================================
      # Upload Artifacts to Release
      # ============================================

      - name: Find and upload macOS artifacts
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          ARCH="${{ matrix.arch }}"

          DMG_PATH=$(find target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -n 1)
          UPDATER_ARCHIVE=$(find target/${{ matrix.target }}/release/bundle -name "*.app.tar.gz" | head -n 1)
          UPDATER_SIG=$(find target/${{ matrix.target }}/release/bundle -name "*.app.tar.gz.sig" | head -n 1)

          if [ -z "$DMG_PATH" ]; then
            echo "❌ ERROR: No DMG file found!"
            exit 1
          fi
          if [ -z "$UPDATER_ARCHIVE" ] || [ -z "$UPDATER_SIG" ]; then
            echo "❌ ERROR: Missing updater archive/signature (.app.tar.gz + .sig)"
            exit 1
          fi

          # Name artifacts with arch suffix
          DMG_NAME="QueryPilot_${VERSION}_${ARCH}.dmg"
          ARCHIVE_NAME="QueryPilot_${VERSION}_${ARCH}.app.tar.gz"
          SIG_NAME="QueryPilot_${VERSION}_${ARCH}.app.tar.gz.sig"

          mv "$DMG_PATH" "$DMG_NAME"
          cp "$UPDATER_ARCHIVE" "$ARCHIVE_NAME"
          cp "$UPDATER_SIG" "$SIG_NAME"

          echo "🚀 Uploading: $DMG_NAME, $ARCHIVE_NAME, $SIG_NAME"
          gh release upload "$VERSION" "$DMG_NAME" "$ARCHIVE_NAME" "$SIG_NAME" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (backup)
        uses: actions/upload-artifact@v6
        with:
          name: app-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/
          retention-days: 3

  generate-updater-manifest:
    name: Generate Updater Manifest
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "📥 Downloading release assets..."
          gh release download "$VERSION" --pattern "*.app.tar.gz"
          gh release download "$VERSION" --pattern "*.app.tar.gz.sig"
          ls -lh *.app.tar.gz *.app.tar.gz.sig

      - name: Generate update manifest
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "📄 Generating update manifest..."

          VERSION_NUMBER="${VERSION#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Extract release notes from CHANGELOG.md (safely via jq for JSON escaping)
          RAW_NOTES=$(awk "/^## \[$VERSION_NUMBER\]/{found=1;next} found && /^## \[/{exit} found" CHANGELOG.md || true)

          # Fallback: generate from git commits
          if [ -z "$RAW_NOTES" ]; then
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -n 1 || true)
            if [ -n "$PREV_TAG" ]; then
              RAW_NOTES=$(git log "${PREV_TAG}..${VERSION}" --pretty=format:"- %s" --no-merges 2>/dev/null | head -20 || true)
            fi
          fi

          if [ -z "$RAW_NOTES" ]; then
            RAW_NOTES="See CHANGELOG.md for details"
          fi

          BASE_URL="https://github.com/QueryPilot/QueryPilot/releases/download/$VERSION"

          # Arch-specific updater archives
          AARCH64_ARCHIVE="QueryPilot_${VERSION}_aarch64.app.tar.gz"
          AARCH64_SIG="QueryPilot_${VERSION}_aarch64.app.tar.gz.sig"
          X86_64_ARCHIVE="QueryPilot_${VERSION}_x86_64.app.tar.gz"
          X86_64_SIG="QueryPilot_${VERSION}_x86_64.app.tar.gz.sig"

          for f in "$AARCH64_ARCHIVE" "$AARCH64_SIG" "$X86_64_ARCHIVE" "$X86_64_SIG"; do
            if [ ! -f "$f" ]; then
              echo "❌ Missing updater asset: $f"
              exit 1
            fi
          done

          AARCH64_SIGNATURE=$(tr -d '\r\n' < "$AARCH64_SIG")
          X86_64_SIGNATURE=$(tr -d '\r\n' < "$X86_64_SIG")

          jq -n \
            --arg version "$VERSION_NUMBER" \
            --arg notes "$RAW_NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg aarch64_sig "$AARCH64_SIGNATURE" \
            --arg aarch64_url "$BASE_URL/$AARCH64_ARCHIVE" \
            --arg x86_64_sig "$X86_64_SIGNATURE" \
            --arg x86_64_url "$BASE_URL/$X86_64_ARCHIVE" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $aarch64_sig, url: $aarch64_url },
                "darwin-x86_64": { signature: $x86_64_sig, url: $x86_64_url }
              }
            }' > latest.json
          echo "✓ Generated arch-specific updater manifest"

          echo "✓ Update manifest generated"
          cat latest.json

      - name: Upload manifest to source release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "📤 Uploading update manifest to source release..."
          gh release upload "$VERSION" latest.json --clobber
          echo "✓ Uploaded to QueryPilot/studio release"

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@v6
        with:
          name: update-manifest
          path: latest.json
          retention-days: 90

  publish-to-app-repo:
    name: Publish to QueryPilot/QueryPilot
    needs: [create-release, build-release, generate-updater-manifest]
    runs-on: ubuntu-latest
    if: |
      success() &&
      (github.event.inputs.publish_to_app_repo == 'true' ||
       github.event_name == 'push')

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "📥 Downloading release assets from studio..."
          gh release download "$VERSION" --pattern "*.dmg"
          gh release download "$VERSION" --pattern "*.app.tar.gz"
          gh release download "$VERSION" --pattern "*.app.tar.gz.sig"
          gh release download "$VERSION" --pattern "latest.json"
          ls -lh

      - name: Extract release notes
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          VERSION_NUMBER="${VERSION#v}"

          # Extract from CHANGELOG.md (only current version, stop at next version header)
          CHANGELOG_CONTENT=$(awk "/^## \[$VERSION_NUMBER\]/{found=1;next} found && /^## \[/{exit} found" CHANGELOG.md || true)

          # Fallback: generate changelog from git commits between tags
          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "⚠️ No changelog entry for $VERSION_NUMBER, generating from commits..."

            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -n 1 || true)
            if [ -n "$PREV_TAG" ]; then
              COMMIT_RANGE="${PREV_TAG}..${VERSION}"
            else
              COMMIT_RANGE="${VERSION}"
            fi

            FEATURES=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges --grep="^feat" 2>/dev/null || true)
            FIXES=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges --grep="^fix" 2>/dev/null || true)
            OTHER=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges --grep="^chore\|^refactor\|^perf\|^docs\|^style\|^ci" 2>/dev/null || true)

            if [ -z "$FEATURES" ] && [ -z "$FIXES" ] && [ -z "$OTHER" ]; then
              CHANGELOG_CONTENT=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges 2>/dev/null | head -30 || true)
            else
              CHANGELOG_CONTENT=""
              [ -n "$FEATURES" ] && CHANGELOG_CONTENT="### New Features
          ${FEATURES}
          "
              [ -n "$FIXES" ] && CHANGELOG_CONTENT="${CHANGELOG_CONTENT}
          ### Bug Fixes
          ${FIXES}
          "
              [ -n "$OTHER" ] && CHANGELOG_CONTENT="${CHANGELOG_CONTENT}
          ### Other Changes
          ${OTHER}"
            fi
          fi

          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="No notable changes in this release."
          fi

          # Build release notes (changelog only)
          echo "## What's Changed" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "$CHANGELOG_CONTENT" >> RELEASE_NOTES.md

          echo "📝 Release notes prepared:"
          cat RELEASE_NOTES.md

      - name: Publish to QueryPilot/QueryPilot
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "🚀 Publishing to QueryPilot/QueryPilot..."

          # Check if release exists
          if gh release view "$VERSION" --repo QueryPilot/QueryPilot &> /dev/null; then
            echo "⚠️  Release already exists, deleting..."
            gh release delete "$VERSION" --repo QueryPilot/QueryPilot --yes
          fi

          # Determine if prerelease
          # Create release (always as full release so /releases/latest works for updater)
          gh release create "$VERSION" \
            --repo QueryPilot/QueryPilot \
            --title "Query Pilot $VERSION" \
            --notes-file RELEASE_NOTES.md \
            *.dmg \
            *.app.tar.gz \
            *.app.tar.gz.sig \
            latest.json \
            CHANGELOG.md

          echo "✅ Published to QueryPilot/QueryPilot"
          echo "🔗 https://github.com/QueryPilot/QueryPilot/releases/tag/$VERSION"

      - name: Verify update manifest
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "🔍 Verifying update manifest is accessible..."
          sleep 10  # Wait for GitHub to process

          # Check the specific release tag (not /latest which skips pre-releases)
          if gh api "repos/QueryPilot/QueryPilot/releases/tags/$VERSION" --jq '.assets[].name' | grep -q "latest.json"; then
            echo "✅ Update manifest is live!"
            echo "🔗 https://github.com/QueryPilot/QueryPilot/releases/tag/$VERSION"
          else
            echo "⚠️  Manifest not yet accessible (may take a few moments)"
          fi

  finalize-release:
    name: Finalize Release
    needs:
      [
        create-release,
        build-release,
        generate-updater-manifest,
        publish-to-app-repo,
      ]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build-release.result == 'success' &&
      needs.generate-updater-manifest.result == 'success' &&
      (needs.publish-to-app-repo.result == 'success' || needs.publish-to-app-repo.result == 'skipped')

    steps:
      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "Publishing draft release $VERSION..."
          gh release edit "$VERSION" --draft=false --repo "${{ github.repository }}"
          echo "Release $VERSION published!"

      - name: Release summary
        run: |
          echo "🎉 All builds completed successfully!"
          echo ""
          echo "Release: ${{ needs.create-release.outputs.version }}"
          echo ""
          echo "📦 Source Release (QueryPilot/studio):"
          echo "   https://github.com/${{ github.repository }}/releases"
          echo ""
          echo "🚀 Public Release (QueryPilot/QueryPilot):"
          echo "   https://github.com/QueryPilot/QueryPilot/releases"
