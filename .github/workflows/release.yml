name: Release Build (Enhanced with Updater)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version to release (e.g. v2026.1.0 or v2026.1.0-beta.1)"
        required: true
        type: string
      publish_to_app_repo:
        description: "Publish to QueryPilot/studio-app?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # Required for creating releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Don't cancel release builds

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Delete existing release with same tag if exists
          if gh release view "$VERSION" &> /dev/null; then
            echo "🗑️ Deleting existing release $VERSION..."
            gh release delete "$VERSION" --yes
          fi

          PRERELEASE=""
          if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            PRERELEASE="--prerelease"
          fi

          VERSION_NUMBER="${VERSION#v}"

          # Extract changelog for this version only (stop at next version header)
          CHANGELOG_CONTENT=$(awk "/^## \[$VERSION_NUMBER\]/{found=1;next} found && /^## \[/{exit} found" CHANGELOG.md || true)
          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="See CHANGELOG.md for details"
          fi

          # Create release notes
          cat > /tmp/release-notes.md << EOF
          ## Query Pilot $VERSION

          $CHANGELOG_CONTENT

          ---

          ### Installation

          **macOS**
          - Download \`QueryPilot_$VERSION.dmg\` (works on both Intel and Apple Silicon)
          - Open DMG and drag Query Pilot to Applications

          ### Code Signing
          - **macOS**: Signed and notarized with Apple Developer ID

          ### Full Changelog
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)
          EOF

          gh release create "$VERSION" \
            --draft \
            $PRERELEASE \
            --title "Query Pilot $VERSION" \
            --notes-file /tmp/release-notes.md

  build-release:
    name: Build (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14 # M1 ARM runner for universal builds
            platform: macos
            target: universal-apple-darwin
            arch: universal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: true
          cache-all-crates: true
          shared-key: "release-${{ matrix.target }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ============================================
      # macOS Code Signing & Notarization Setup
      # ============================================

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: temporary_build_keychain_password
        run: |
          # Create temporary keychain with password
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Decode and import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign

          # Allow codesigning to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Verify certificate was imported
          security find-identity -v -p codesigning build.keychain

          # Clean up
          rm certificate.p12

      # ============================================
      # Build MCP Sidecar (required by externalBin)
      # ============================================

      - name: Build MCP sidecar (universal binary)
        run: |
          cargo build --release --package querypilot-mcp --target aarch64-apple-darwin
          cargo build --release --package querypilot-mcp --target x86_64-apple-darwin
          mkdir -p target/release
          # Create arch-specific copies for Tauri bundling
          cp target/aarch64-apple-darwin/release/querypilot-mcp target/release/querypilot-mcp-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/querypilot-mcp target/release/querypilot-mcp-x86_64-apple-darwin
          # Create universal binary
          lipo -create \
            target/aarch64-apple-darwin/release/querypilot-mcp \
            target/x86_64-apple-darwin/release/querypilot-mcp \
            -output target/release/querypilot-mcp-universal-apple-darwin
          echo "MCP sidecar built for universal-apple-darwin"

      # ============================================
      # Build Tauri App
      # ============================================

      - name: Build Tauri app (macOS with signing)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_DISABLE_SOURCEMAPS: "true"
          APPLE_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Sentry Configuration (optional - only used if secrets are set)
          # Single DSN for all components (Frontend, Backend, Sidecar)
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # SENTRY_AUTH_TOKEN disabled - source maps upload causes OOM on M1 runners
          # SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'query-pilot' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'query-pilot' }}
          # GitHub token for update checker (read-only, compiled into Rust binary)
          # Use separate token from RELEASE_PAT which needs write access for publishing
          GITHUB_RELEASE_TOKEN: ${{ secrets.UPDATE_CHECKER_PAT }}
        shell: bash
        run: |
          # Build frontend with Sentry source maps (if SENTRY_AUTH_TOKEN is set)
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "🔍 Sentry configured - source maps will be uploaded"
          else
            echo "⚠️  Sentry not configured - telemetry disabled"
          fi

          # Build Tauri with telemetry feature if Sentry DSN is configured
          if [ -n "$SENTRY_DSN" ]; then
            echo "🚀 Building with telemetry feature enabled"
            pnpm tauri build --target ${{ matrix.target }} -- --features telemetry
          else
            echo "🚀 Building without telemetry"
            pnpm tauri build --target ${{ matrix.target }}
          fi

      - name: Cleanup macOS keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f certificate.p12 || true

      # ============================================
      # Upload Artifacts to Release
      # ============================================

      - name: Find and upload macOS DMG
        run: |
          echo "🔍 Searching for DMG files..."
          find target/${{ matrix.target }}/release/bundle -type f -name "*.dmg" || echo "No DMG files found"

          DMG_PATH=$(find target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -n "$DMG_PATH" ]; then
            VERSION="${{ needs.create-release.outputs.version }}"
            DMG_NAME="QueryPilot_${VERSION}.dmg"
            echo "📦 Found DMG: $DMG_PATH"
            echo "📤 Renaming to: $DMG_NAME"
            mv "$DMG_PATH" "$DMG_NAME"

            echo "🚀 Uploading to release: $VERSION"
            gh release upload "$VERSION" \
              "$DMG_NAME" \
              --clobber

            echo "✅ Uploaded: $DMG_NAME"
          else
            echo "❌ ERROR: No DMG file found!"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/
          retention-days: 3

  generate-updater-manifest:
    name: Generate Updater Manifest
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "📥 Downloading release assets..."
          gh release download "$VERSION" --pattern "*.dmg"
          ls -lh *.dmg

      - name: Generate update manifest
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
        run: |
          echo "📄 Generating update manifest..."

          VERSION_NUMBER="${VERSION#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Extract release notes from CHANGELOG.md (safely via jq for JSON escaping)
          RAW_NOTES=$(awk "/^## \[$VERSION_NUMBER\]/{found=1;next} found && /^## \[/{exit} found" CHANGELOG.md || true)
          if [ -z "$RAW_NOTES" ]; then
            RAW_NOTES="See CHANGELOG.md for details"
          fi

          DMG_NAME="QueryPilot_${VERSION}.dmg"
          DMG_URL="https://github.com/QueryPilot/studio-app/releases/download/$VERSION/$DMG_NAME"
          SIGNATURE=""

          # Sign DMG files if key is available
          if [ -n "$TAURI_PRIVATE_KEY" ]; then
            echo "🔐 Signing release assets..."

            if [ -f "$DMG_NAME" ]; then
              echo "  Signing $DMG_NAME..."
              # Use pnpm dlx to run tauri CLI without global install
              # Pass key directly as string (--private-key expects key content, not file path)
              # Capture only the last line to avoid CLI noise
              SIGNATURE=$(pnpm dlx @tauri-apps/cli signer sign "$DMG_NAME" --private-key "$TAURI_PRIVATE_KEY" --password "$TAURI_KEY_PASSWORD" 2>/dev/null | tail -n 1 || true)

              # Validate signature looks like base64
              if [ -n "$SIGNATURE" ] && ! echo "$SIGNATURE" | grep -qE '^[A-Za-z0-9+/=]{20,}$'; then
                echo "⚠️  Captured signature doesn't look like base64, discarding"
                SIGNATURE=""
              fi
            fi
          else
            echo "⚠️  TAURI_PRIVATE_KEY not set, generating unsigned manifest"
          fi

          # Build manifest with jq for safe JSON generation
          if [ -n "$SIGNATURE" ]; then
            jq -n \
              --arg version "$VERSION_NUMBER" \
              --arg notes "$RAW_NOTES" \
              --arg pub_date "$PUB_DATE" \
              --arg sig "$SIGNATURE" \
              --arg url "$DMG_URL" \
              '{
                version: $version,
                notes: $notes,
                pub_date: $pub_date,
                platforms: {
                  "darwin-aarch64": { signature: $sig, url: $url },
                  "darwin-x86_64": { signature: $sig, url: $url }
                }
              }' > latest.json
            echo "✓ Signed darwin-aarch64 and darwin-x86_64 (universal)"
          else
            jq -n \
              --arg version "$VERSION_NUMBER" \
              --arg notes "$RAW_NOTES" \
              --arg pub_date "$PUB_DATE" \
              --arg url "$DMG_URL" \
              '{
                version: $version,
                notes: $notes,
                pub_date: $pub_date,
                platforms: {
                  "darwin-aarch64": { url: $url },
                  "darwin-x86_64": { url: $url }
                }
              }' > latest.json
          fi

          echo "✓ Update manifest generated"
          cat latest.json

      - name: Upload manifest to source release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "📤 Uploading update manifest to source release..."
          gh release upload "$VERSION" latest.json --clobber
          echo "✓ Uploaded to QueryPilot/studio release"

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: latest.json
          retention-days: 90

  publish-to-app-repo:
    name: Publish to QueryPilot/studio-app
    needs: [create-release, build-release, generate-updater-manifest]
    runs-on: ubuntu-latest
    if: |
      success() &&
      (github.event.inputs.publish_to_app_repo == 'true' ||
       github.event_name == 'push')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "📥 Downloading release assets from studio..."
          gh release download "$VERSION" --pattern "*.dmg"
          gh release download "$VERSION" --pattern "latest.json"
          ls -lh

      - name: Extract release notes
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          VERSION_NUMBER="${VERSION#v}"

          # Extract from CHANGELOG.md (only current version, stop at next version header)
          awk "/^## \[$VERSION_NUMBER\]/{found=1;next} found && /^## \[/{exit} found" CHANGELOG.md > RELEASE_NOTES.md

          # Add footer
          cat >> RELEASE_NOTES.md << EOF

          ---

          ## Installation

          **macOS:**
          - Download \`QueryPilot_${VERSION}.dmg\` (works on both Intel and Apple Silicon Macs)
          - Open DMG and drag Query Pilot to Applications folder
          - On first launch, right-click the app and select "Open" if you see a security warning

          **Windows and Linux:** Coming soon

          ## Full Changelog

          See [CHANGELOG.md](https://github.com/QueryPilot/studio-app/blob/main/CHANGELOG.md) for complete version history.
          EOF

          echo "📝 Release notes prepared:"
          cat RELEASE_NOTES.md

      - name: Publish to studio-app repository
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "🚀 Publishing to QueryPilot/studio-app..."

          # Check if release exists
          if gh release view "$VERSION" --repo QueryPilot/studio-app &> /dev/null; then
            echo "⚠️  Release already exists, deleting..."
            gh release delete "$VERSION" --repo QueryPilot/studio-app --yes
          fi

          # Determine if prerelease
          PRERELEASE=""
          if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            PRERELEASE="--prerelease"
          fi

          # Create release
          gh release create "$VERSION" \
            --repo QueryPilot/studio-app \
            --title "Query Pilot $VERSION" \
            --notes-file RELEASE_NOTES.md \
            $PRERELEASE \
            *.dmg \
            latest.json \
            CHANGELOG.md

          echo "✅ Published to QueryPilot/studio-app"
          echo "🔗 https://github.com/QueryPilot/studio-app/releases/tag/$VERSION"

      - name: Verify update manifest
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "🔍 Verifying update manifest is accessible..."
          sleep 10  # Wait for GitHub to process

          # Check the specific release tag (not /latest which skips pre-releases)
          if gh api "repos/QueryPilot/studio-app/releases/tags/$VERSION" --jq '.assets[].name' | grep -q "latest.json"; then
            echo "✅ Update manifest is live!"
            echo "🔗 https://github.com/QueryPilot/studio-app/releases/tag/$VERSION"
          else
            echo "⚠️  Manifest not yet accessible (may take a few moments)"
          fi

  finalize-release:
    name: Finalize Release
    needs: [create-release, build-release, generate-updater-manifest, publish-to-app-repo]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build-release.result == 'success' &&
      needs.generate-updater-manifest.result == 'success' &&
      (needs.publish-to-app-repo.result == 'success' || needs.publish-to-app-repo.result == 'skipped')

    steps:
      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "Publishing draft release $VERSION..."
          gh release edit "$VERSION" --draft=false --repo "${{ github.repository }}"
          echo "Release $VERSION published!"

      - name: Release summary
        run: |
          echo "🎉 All builds completed successfully!"
          echo ""
          echo "Release: ${{ needs.create-release.outputs.version }}"
          echo ""
          echo "📦 Source Release (QueryPilot/studio):"
          echo "   https://github.com/${{ github.repository }}/releases"
          echo ""
          echo "🚀 Public Release (QueryPilot/studio-app):"
          echo "   https://github.com/QueryPilot/studio-app/releases"
