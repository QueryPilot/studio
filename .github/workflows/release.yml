name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'  # Trigger on version tags like v1.0.0
  workflow_dispatch:  # Allow manual triggering
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write  # Required for creating releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel release builds

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          PRERELEASE=""
          if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]]; then
            PRERELEASE="--prerelease"
          fi

          gh release create "$VERSION" \
            --draft \
            $PRERELEASE \
            --title "Query Pilot $VERSION" \
            --notes "## 🚀 Query Pilot $VERSION

          ### What's New
          <!-- Add release notes here -->

          ### 📦 Installation

          **macOS (Apple Silicon)**
          - Download \`Query-Pilot_aarch64.dmg\`
          - Open and drag to Applications

          **macOS (Intel)**
          - Download \`Query-Pilot_x86_64.dmg\`
          - Open and drag to Applications

          **Windows**
          - Download \`Query-Pilot_x64_setup.exe\`
          - Run installer

          **Linux**
          - Download \`Query-Pilot_amd64.AppImage\`
          - Make executable: \`chmod +x Query-Pilot_amd64.AppImage\`
          - Run: \`./Query-Pilot_amd64.AppImage\`

          ### ⚠️ Code Signing
          - **macOS**: Self-signed (you may need to allow in System Preferences > Security)
          - **Windows**: Self-signed (SmartScreen warning expected on first run)
          - **Linux**: No signature required

          ### 📝 Full Changelog
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)"

  build-release:
    name: Build (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
            arch: aarch64

          - os: macos-13  # Intel Mac
            platform: macos
            target: x86_64-apple-darwin
            arch: x86_64

          # Linux build
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            arch: amd64

          # Windows build
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc
            arch: x64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libgtk-3-dev

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AI sidecar
        run: pnpm build:ai-sidecar

      # ============================================
      # Code Signing Configuration (Optional)
      # ============================================

      # macOS Code Signing (Optional)
      - name: Import macOS certificate
        if: matrix.platform == 'macos' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          # Import certificate
          CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12
          echo "$APPLE_CERTIFICATE" | base64 --decode > $CERTIFICATE_PATH
          security import $CERTIFICATE_PATH \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k $KEYCHAIN_PATH

          security list-keychain -d user -s $KEYCHAIN_PATH

          # Set signing identity
          echo "APPLE_SIGNING_IDENTITY=${{ secrets.APPLE_SIGNING_IDENTITY }}" >> $GITHUB_ENV
          echo "ENABLE_CODE_SIGNING=true" >> $GITHUB_ENV

      # Windows Code Signing (Optional)
      - name: Setup Windows certificate
        if: matrix.platform == 'windows' && env.WINDOWS_CERTIFICATE != ''
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        shell: powershell
        run: |
          # Decode certificate
          $certBytes = [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $certPath = Join-Path $env:RUNNER_TEMP "certificate.pfx"
          [IO.File]::WriteAllBytes($certPath, $certBytes)

          # Import to certificate store
          $cert = Import-PfxCertificate `
            -FilePath $certPath `
            -CertStoreLocation Cert:\CurrentUser\My `
            -Password (ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)

          echo "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          echo "ENABLE_CODE_SIGNING=true" >> $env:GITHUB_ENV

      # ============================================
      # Build Tauri App
      # ============================================

      - name: Build Tauri app (with signing)
        if: env.ENABLE_CODE_SIGNING == 'true'
        env:
          # macOS notarization (optional)
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm tauri:build

      - name: Build Tauri app (without signing)
        if: env.ENABLE_CODE_SIGNING != 'true'
        env:
          # Disable code signing for self-signed builds
          TAURI_PRIVATE_KEY: ""
          TAURI_KEY_PASSWORD: ""
        run: pnpm tauri:build

      # ============================================
      # Self-sign macOS app (fallback)
      # ============================================

      - name: Self-sign macOS app
        if: matrix.platform == 'macos' && env.ENABLE_CODE_SIGNING != 'true'
        run: |
          echo "🔓 Creating self-signed macOS app..."

          # Find the .app bundle
          APP_PATH=$(find src-tauri/target/${{ matrix.target }}/release/bundle/macos -name "*.app" | head -n 1)

          if [ -n "$APP_PATH" ]; then
            # Ad-hoc sign (allows running on local machine)
            codesign --force --deep --sign - "$APP_PATH"
            echo "✅ Self-signed: $APP_PATH"
          fi

      # ============================================
      # Upload Artifacts to Release
      # ============================================

      - name: Find and upload macOS DMG
        if: matrix.platform == 'macos'
        run: |
          DMG_PATH=$(find src-tauri/target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -n 1)
          if [ -n "$DMG_PATH" ]; then
            DMG_NAME="Query-Pilot_${{ matrix.arch }}.dmg"
            mv "$DMG_PATH" "$DMG_NAME"

            gh release upload ${{ needs.create-release.outputs.version }} \
              "$DMG_NAME" \
              --clobber

            echo "✅ Uploaded: $DMG_NAME"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and upload Windows installer
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          # Find MSI or NSIS installer
          INSTALLER_PATH=$(find src-tauri/target/${{ matrix.target }}/release/bundle -name "*.msi" -o -name "*_setup.exe" | head -n 1)
          if [ -n "$INSTALLER_PATH" ]; then
            INSTALLER_NAME="Query-Pilot_${{ matrix.arch }}_setup.exe"
            mv "$INSTALLER_PATH" "$INSTALLER_NAME"

            gh release upload ${{ needs.create-release.outputs.version }} \
              "$INSTALLER_NAME" \
              --clobber

            echo "✅ Uploaded: $INSTALLER_NAME"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Find and upload Linux AppImage
        if: matrix.platform == 'linux'
        run: |
          APPIMAGE_PATH=$(find src-tauri/target/${{ matrix.target }}/release/bundle/appimage -name "*.AppImage" | head -n 1)
          if [ -n "$APPIMAGE_PATH" ]; then
            APPIMAGE_NAME="Query-Pilot_${{ matrix.arch }}.AppImage"
            mv "$APPIMAGE_PATH" "$APPIMAGE_NAME"
            chmod +x "$APPIMAGE_NAME"

            gh release upload ${{ needs.create-release.outputs.version }} \
              "$APPIMAGE_NAME" \
              --clobber

            echo "✅ Uploaded: $APPIMAGE_NAME"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 7

      # ============================================
      # Cleanup
      # ============================================

      - name: Cleanup macOS keychain
        if: matrix.platform == 'macos' && env.ENABLE_CODE_SIGNING == 'true'
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true

  finalize-release:
    name: Finalize Release
    needs: [create-release, build-release]
    runs-on: ubuntu-latest

    steps:
      - name: Update release status
        run: |
          echo "🎉 All builds completed successfully!"
          echo ""
          echo "Release: ${{ needs.create-release.outputs.version }}"
          echo "Draft release created - review and publish at:"
          echo "https://github.com/${{ github.repository }}/releases"
