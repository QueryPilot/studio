name: Release Build (Enhanced with Updater)

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version to release (e.g. v2026.1.0 or v2026.1.0-beta.1)"
        required: true
        type: string
      publish_to_app_repo:
        description: "Publish to QueryPilot/studio-app?"
        required: false
        type: boolean
        default: false

permissions:
  contents: write # Required for creating releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Don't cancel release builds

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for changelog generation from commits

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          # Delete existing release with same tag if exists
          if gh release view "$VERSION" &> /dev/null; then
            echo "🗑️ Deleting existing release $VERSION..."
            gh release delete "$VERSION" --yes
          fi

          PRERELEASE=""
          if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            PRERELEASE="--prerelease"
          fi

          VERSION_NUMBER="${VERSION#v}"

          # Extract changelog for this version only (stop at next version header)
          CHANGELOG_CONTENT=$(awk "/^## \[$VERSION_NUMBER\]/{found=1;next} found && /^## \[/{exit} found" CHANGELOG.md || true)

          # Fallback: generate changelog from git commits between tags
          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "⚠️ No changelog entry found for $VERSION_NUMBER in CHANGELOG.md"
            echo "📝 Generating release notes from git commits..."

            # Find the previous tag
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -n 1 || true)

            if [ -n "$PREV_TAG" ]; then
              COMMIT_RANGE="${PREV_TAG}..${VERSION}"
            else
              COMMIT_RANGE="${VERSION}"
            fi

            # Generate categorized changelog from conventional commits
            FEATURES=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges --grep="^feat" 2>/dev/null || true)
            FIXES=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges --grep="^fix" 2>/dev/null || true)
            OTHER=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges --grep="^chore\|^refactor\|^perf\|^docs\|^style\|^ci" 2>/dev/null || true)

            # If conventional commits didn't match, list all commits
            if [ -z "$FEATURES" ] && [ -z "$FIXES" ] && [ -z "$OTHER" ]; then
              CHANGELOG_CONTENT=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges 2>/dev/null | head -30 || true)
            else
              CHANGELOG_CONTENT=""
              if [ -n "$FEATURES" ]; then
                CHANGELOG_CONTENT="### New Features
          ${FEATURES}
          "
              fi
              if [ -n "$FIXES" ]; then
                CHANGELOG_CONTENT="${CHANGELOG_CONTENT}
          ### Bug Fixes
          ${FIXES}
          "
              fi
              if [ -n "$OTHER" ]; then
                CHANGELOG_CONTENT="${CHANGELOG_CONTENT}
          ### Other Changes
          ${OTHER}"
              fi
            fi
          fi

          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="No notable changes in this release."
          fi

          # Create release notes by building file incrementally
          echo "## What's Changed" > /tmp/release-notes.md
          echo "" >> /tmp/release-notes.md
          echo "$CHANGELOG_CONTENT" >> /tmp/release-notes.md
          cat >> /tmp/release-notes.md << EOF

          ---

          ### Installation

          **macOS:**
          - Download \`QueryPilot_${VERSION}.dmg\` (works on both Intel and Apple Silicon Macs)
          - Open DMG and drag Query Pilot to Applications folder
          - On first launch, right-click the app and select "Open" if you see a security warning

          **Windows and Linux:** Coming soon

          ### Full Changelog
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for complete version history.
          EOF

          gh release create "$VERSION" \
            --draft \
            $PRERELEASE \
            --title "Query Pilot $VERSION" \
            --notes-file /tmp/release-notes.md

  build-release:
    name: Build (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26 # ARM runner for universal builds
            platform: macos
            target: universal-apple-darwin
            arch: universal

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true
          cache-on-failure: true
          cache-all-crates: true
          shared-key: "release-${{ matrix.target }}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ============================================
      # macOS Code Signing & Notarization Setup
      # ============================================

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: temporary_build_keychain_password
        run: |
          # Create temporary keychain with password
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # Decode and import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign

          # Allow codesigning to access keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain

          # Verify certificate was imported
          security find-identity -v -p codesigning build.keychain

          # Clean up
          rm certificate.p12

      # ============================================
      # Build MCP Sidecar (required by externalBin)
      # ============================================

      - name: Build MCP sidecar (universal binary)
        run: |
          cargo build --release --package querypilot-mcp --target aarch64-apple-darwin
          cargo build --release --package querypilot-mcp --target x86_64-apple-darwin
          mkdir -p target/release
          # Create arch-specific copies for Tauri bundling
          cp target/aarch64-apple-darwin/release/querypilot-mcp target/release/querypilot-mcp-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/querypilot-mcp target/release/querypilot-mcp-x86_64-apple-darwin
          # Create universal binary
          lipo -create \
            target/aarch64-apple-darwin/release/querypilot-mcp \
            target/x86_64-apple-darwin/release/querypilot-mcp \
            -output target/release/querypilot-mcp-universal-apple-darwin
          echo "MCP sidecar built for universal-apple-darwin"

      # ============================================
      # Build Tauri App
      # ============================================

      - name: Build Tauri app (macOS with signing)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          VITE_DISABLE_SOURCEMAPS: "true"
          APPLE_ID: ${{ secrets.APPLE_DEVELOPER_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          # Sentry Configuration (optional - only used if secrets are set)
          # Single DSN for all components (Frontend, Backend, Sidecar)
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # SENTRY_AUTH_TOKEN disabled - source maps upload causes OOM on M1 runners
          # SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG || 'query-pilot' }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT || 'query-pilot' }}
          # GitHub token for update checker (read-only, compiled into Rust binary)
          # Use separate token from RELEASE_PAT which needs write access for publishing
          GITHUB_RELEASE_TOKEN: ${{ secrets.UPDATE_CHECKER_PAT }}
        shell: bash
        run: |
          # Build frontend with Sentry source maps (if SENTRY_AUTH_TOKEN is set)
          if [ -n "$SENTRY_AUTH_TOKEN" ]; then
            echo "🔍 Sentry configured - source maps will be uploaded"
          else
            echo "⚠️  Sentry not configured - telemetry disabled"
          fi

          # Build Tauri with telemetry feature if Sentry DSN is configured
          if [ -n "$SENTRY_DSN" ]; then
            echo "🚀 Building with telemetry feature enabled"
            pnpm tauri build --target ${{ matrix.target }} -- --features telemetry
          else
            echo "🚀 Building without telemetry"
            pnpm tauri build --target ${{ matrix.target }}
          fi

      - name: Cleanup macOS keychain
        if: always()
        run: |
          security delete-keychain build.keychain || true
          rm -f certificate.p12 || true

      # ============================================
      # Upload Artifacts to Release
      # ============================================

      - name: Find and upload macOS artifacts
        run: |
          echo "🔍 Searching for updater artifacts..."
          find target/${{ matrix.target }}/release/bundle -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.app.tar.gz.sig" \) || echo "No matching files found"

          DMG_PATH=$(find target/${{ matrix.target }}/release/bundle/dmg -name "*.dmg" | head -n 1)
          UPDATER_ARCHIVE=$(find target/${{ matrix.target }}/release/bundle -name "*.app.tar.gz" | head -n 1)
          UPDATER_SIG=$(find target/${{ matrix.target }}/release/bundle -name "*.app.tar.gz.sig" | head -n 1)

          if [ -z "$DMG_PATH" ]; then
            echo "❌ ERROR: No DMG file found!"
            exit 1
          fi
          if [ -z "$UPDATER_ARCHIVE" ] || [ -z "$UPDATER_SIG" ]; then
            echo "❌ ERROR: Missing updater archive/signature (.app.tar.gz + .sig)"
            exit 1
          fi

          VERSION="${{ needs.create-release.outputs.version }}"
          DMG_NAME="QueryPilot_${VERSION}.dmg"
          ARCHIVE_NAME=$(basename "$UPDATER_ARCHIVE")
          SIG_NAME=$(basename "$UPDATER_SIG")

          echo "📦 Found DMG: $DMG_PATH"
          echo "📦 Found updater archive: $UPDATER_ARCHIVE"
          echo "📦 Found updater signature: $UPDATER_SIG"

          mv "$DMG_PATH" "$DMG_NAME"
          cp "$UPDATER_ARCHIVE" "$ARCHIVE_NAME"
          cp "$UPDATER_SIG" "$SIG_NAME"

          echo "🚀 Uploading to release: $VERSION"
          gh release upload "$VERSION" \
            "$DMG_NAME" \
            "$ARCHIVE_NAME" \
            "$SIG_NAME" \
            --clobber

          echo "✅ Uploaded: $DMG_NAME, $ARCHIVE_NAME, $SIG_NAME"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            target/${{ matrix.target }}/release/bundle/
          retention-days: 3

  generate-updater-manifest:
    name: Generate Updater Manifest
    needs: [create-release, build-release]
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "📥 Downloading release assets..."
          gh release download "$VERSION" --pattern "*.app.tar.gz"
          gh release download "$VERSION" --pattern "*.app.tar.gz.sig"
          ls -lh *.app.tar.gz *.app.tar.gz.sig

      - name: Generate update manifest
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "📄 Generating update manifest..."

          VERSION_NUMBER="${VERSION#v}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Extract release notes from CHANGELOG.md (safely via jq for JSON escaping)
          RAW_NOTES=$(awk "/^## \[$VERSION_NUMBER\]/{found=1;next} found && /^## \[/{exit} found" CHANGELOG.md || true)

          # Fallback: generate from git commits
          if [ -z "$RAW_NOTES" ]; then
            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -n 1 || true)
            if [ -n "$PREV_TAG" ]; then
              RAW_NOTES=$(git log "${PREV_TAG}..${VERSION}" --pretty=format:"- %s" --no-merges 2>/dev/null | head -20 || true)
            fi
          fi

          if [ -z "$RAW_NOTES" ]; then
            RAW_NOTES="See CHANGELOG.md for details"
          fi

          UPDATE_ARCHIVE=$(ls *.app.tar.gz | head -n 1)
          UPDATE_SIG_FILE=$(ls *.app.tar.gz.sig | head -n 1)

          if [ -z "$UPDATE_ARCHIVE" ] || [ -z "$UPDATE_SIG_FILE" ]; then
            echo "❌ Missing updater assets for manifest generation"
            exit 1
          fi

          UPDATE_URL="https://github.com/QueryPilot/studio-app/releases/download/$VERSION/$UPDATE_ARCHIVE"
          SIGNATURE=$(tr -d '\r\n' < "$UPDATE_SIG_FILE")

          if [ -z "$SIGNATURE" ]; then
            echo "❌ Signature file is empty: $UPDATE_SIG_FILE"
            exit 1
          fi

          jq -n \
            --arg version "$VERSION_NUMBER" \
            --arg notes "$RAW_NOTES" \
            --arg pub_date "$PUB_DATE" \
            --arg sig "$SIGNATURE" \
            --arg url "$UPDATE_URL" \
            '{
              version: $version,
              notes: $notes,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { signature: $sig, url: $url },
                "darwin-x86_64": { signature: $sig, url: $url }
              }
            }' > latest.json
          echo "✓ Generated signed darwin updater manifest"

          echo "✓ Update manifest generated"
          cat latest.json

      - name: Upload manifest to source release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "📤 Uploading update manifest to source release..."
          gh release upload "$VERSION" latest.json --clobber
          echo "✓ Uploaded to QueryPilot/studio release"

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: update-manifest
          path: latest.json
          retention-days: 90

  publish-to-app-repo:
    name: Publish to QueryPilot/studio-app
    needs: [create-release, build-release, generate-updater-manifest]
    runs-on: ubuntu-latest
    if: |
      success() &&
      (github.event.inputs.publish_to_app_repo == 'true' ||
       github.event_name == 'push')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "📥 Downloading release assets from studio..."
          gh release download "$VERSION" --pattern "*.dmg"
          gh release download "$VERSION" --pattern "*.app.tar.gz"
          gh release download "$VERSION" --pattern "*.app.tar.gz.sig"
          gh release download "$VERSION" --pattern "latest.json"
          ls -lh

      - name: Extract release notes
        env:
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          VERSION_NUMBER="${VERSION#v}"

          # Extract from CHANGELOG.md (only current version, stop at next version header)
          CHANGELOG_CONTENT=$(awk "/^## \[$VERSION_NUMBER\]/{found=1;next} found && /^## \[/{exit} found" CHANGELOG.md || true)

          # Fallback: generate changelog from git commits between tags
          if [ -z "$CHANGELOG_CONTENT" ]; then
            echo "⚠️ No changelog entry for $VERSION_NUMBER, generating from commits..."

            PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${VERSION}$" | head -n 1 || true)
            if [ -n "$PREV_TAG" ]; then
              COMMIT_RANGE="${PREV_TAG}..${VERSION}"
            else
              COMMIT_RANGE="${VERSION}"
            fi

            FEATURES=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges --grep="^feat" 2>/dev/null || true)
            FIXES=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges --grep="^fix" 2>/dev/null || true)
            OTHER=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges --grep="^chore\|^refactor\|^perf\|^docs\|^style\|^ci" 2>/dev/null || true)

            if [ -z "$FEATURES" ] && [ -z "$FIXES" ] && [ -z "$OTHER" ]; then
              CHANGELOG_CONTENT=$(git log "$COMMIT_RANGE" --pretty=format:"- %s" --no-merges 2>/dev/null | head -30 || true)
            else
              CHANGELOG_CONTENT=""
              [ -n "$FEATURES" ] && CHANGELOG_CONTENT="### New Features
          ${FEATURES}
          "
              [ -n "$FIXES" ] && CHANGELOG_CONTENT="${CHANGELOG_CONTENT}
          ### Bug Fixes
          ${FIXES}
          "
              [ -n "$OTHER" ] && CHANGELOG_CONTENT="${CHANGELOG_CONTENT}
          ### Other Changes
          ${OTHER}"
            fi
          fi

          if [ -z "$CHANGELOG_CONTENT" ]; then
            CHANGELOG_CONTENT="No notable changes in this release."
          fi

          # Build release notes
          echo "## What's Changed" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "$CHANGELOG_CONTENT" >> RELEASE_NOTES.md
          cat >> RELEASE_NOTES.md << EOF

          ---

          ## Installation

          **macOS:**
          - Download \`QueryPilot_${VERSION}.dmg\` (works on both Intel and Apple Silicon Macs)
          - Open DMG and drag Query Pilot to Applications folder
          - On first launch, right-click the app and select "Open" if you see a security warning

          **Windows and Linux:** Coming soon

          ## Full Changelog

          See [CHANGELOG.md](https://github.com/QueryPilot/studio-app/blob/main/CHANGELOG.md) for complete version history.
          EOF

          echo "📝 Release notes prepared:"
          cat RELEASE_NOTES.md

      - name: Publish to studio-app repository
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "🚀 Publishing to QueryPilot/studio-app..."

          # Check if release exists
          if gh release view "$VERSION" --repo QueryPilot/studio-app &> /dev/null; then
            echo "⚠️  Release already exists, deleting..."
            gh release delete "$VERSION" --repo QueryPilot/studio-app --yes
          fi

          # Determine if prerelease
          PRERELEASE=""
          if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]]; then
            PRERELEASE="--prerelease"
          fi

          # Create release
          gh release create "$VERSION" \
            --repo QueryPilot/studio-app \
            --title "Query Pilot $VERSION" \
            --notes-file RELEASE_NOTES.md \
            $PRERELEASE \
            *.dmg \
            *.app.tar.gz \
            *.app.tar.gz.sig \
            latest.json \
            CHANGELOG.md

          echo "✅ Published to QueryPilot/studio-app"
          echo "🔗 https://github.com/QueryPilot/studio-app/releases/tag/$VERSION"

      - name: Verify update manifest
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "🔍 Verifying update manifest is accessible..."
          sleep 10  # Wait for GitHub to process

          # Check the specific release tag (not /latest which skips pre-releases)
          if gh api "repos/QueryPilot/studio-app/releases/tags/$VERSION" --jq '.assets[].name' | grep -q "latest.json"; then
            echo "✅ Update manifest is live!"
            echo "🔗 https://github.com/QueryPilot/studio-app/releases/tag/$VERSION"
          else
            echo "⚠️  Manifest not yet accessible (may take a few moments)"
          fi

  finalize-release:
    name: Finalize Release
    needs:
      [
        create-release,
        build-release,
        generate-updater-manifest,
        publish-to-app-repo,
      ]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build-release.result == 'success' &&
      needs.generate-updater-manifest.result == 'success' &&
      (needs.publish-to-app-repo.result == 'success' || needs.publish-to-app-repo.result == 'skipped')

    steps:
      - name: Publish draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          echo "Publishing draft release $VERSION..."
          gh release edit "$VERSION" --draft=false --repo "${{ github.repository }}"
          echo "Release $VERSION published!"

      - name: Release summary
        run: |
          echo "🎉 All builds completed successfully!"
          echo ""
          echo "Release: ${{ needs.create-release.outputs.version }}"
          echo ""
          echo "📦 Source Release (QueryPilot/studio):"
          echo "   https://github.com/${{ github.repository }}/releases"
          echo ""
          echo "🚀 Public Release (QueryPilot/studio-app):"
          echo "   https://github.com/QueryPilot/studio-app/releases"
