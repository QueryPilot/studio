name: Release Build

on:
  push:
    tags:
      - "v*.*.*" # Trigger on version tags like v1.0.0
  workflow_dispatch: # Allow manual triggering
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true
        type: string

permissions:
  contents: write # Required for creating releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false # Don't cancel release builds

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.get_version.outputs.version }}
        run: |
          PRERELEASE=""
          if [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]]; then
            PRERELEASE="--prerelease"
          fi

          gh release create "$VERSION" \
            --draft \
            $PRERELEASE \
            --title "Query Pilot $VERSION" \
            --notes "## 🚀 Query Pilot $VERSION

          ### What's New
          <!-- Add release notes here -->

          ### 📦 Installation

          **Linux**
          - Download \`Query-Pilot_amd64.AppImage\`
          - Make executable: \`chmod +x Query-Pilot_amd64.AppImage\`
          - Run: \`./Query-Pilot_amd64.AppImage\`

          ### ⚠️ Code Signing
          - **Linux**: No signature required (unsigned build)

          ### 📝 Full Changelog
          See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)"

  build-release:
    name: Build (${{ matrix.platform }})
    needs: create-release
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
            arch: amd64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libfuse2

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            src-tauri/target/
          key: ${{ runner.os }}-rust-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-release-
            ${{ runner.os }}-rust-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('src-tauri/sidecar-ai/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AI sidecar
        run: |
          echo "Building AI sidecar for ${{ matrix.target }}..."
          pnpm build:ai-sidecar

          # Verify the sidecar was built
          echo "Checking for built sidecar..."
          ls -la src-tauri/sidecars/ || echo "Sidecars directory not found!"

          # Show what Tauri is looking for
          if [ "${{ matrix.platform }}" = "windows" ]; then
            EXPECTED_FILE="src-tauri/sidecars/ai-server-${{ matrix.target }}.exe"
          else
            EXPECTED_FILE="src-tauri/sidecars/ai-server-${{ matrix.target }}"
          fi

          echo "Tauri expects: $EXPECTED_FILE"

          if [ ! -f "$EXPECTED_FILE" ]; then
            echo "ERROR: Sidecar binary not found!"
            exit 1
          fi

          echo "✅ Sidecar built successfully"
        shell: bash

      # ============================================
      # Build Tauri App (Linux - No Signing)
      # ============================================

      - name: Build Tauri app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          APPIMAGE_EXTRACT_AND_RUN: 1
        shell: bash
        run: |
          # Ensure linuxdeploy tools have execute permissions
          find /tmp -name "linuxdeploy*" -type f -exec chmod +x {} \; 2>/dev/null || true
          find /tmp -name "AppRun*" -type f -exec chmod +x {} \; 2>/dev/null || true
          pnpm tauri:build

      # ============================================
      # Upload Artifacts to Release
      # ============================================

      - name: Find and upload Linux AppImage
        run: |
          echo "🔍 Searching for AppImage files..."
          find src-tauri/target/${{ matrix.target }}/release/bundle -type f -name "*.AppImage" || echo "No AppImage files found"

          APPIMAGE_PATH=$(find src-tauri/target/${{ matrix.target }}/release/bundle/appimage -name "*.AppImage" | head -n 1)
          if [ -n "$APPIMAGE_PATH" ]; then
            APPIMAGE_NAME="Query-Pilot_${{ matrix.arch }}.AppImage"
            echo "📦 Found AppImage: $APPIMAGE_PATH"
            echo "📤 Renaming to: $APPIMAGE_NAME"
            mv "$APPIMAGE_PATH" "$APPIMAGE_NAME"
            chmod +x "$APPIMAGE_NAME"

            echo "🚀 Uploading to release: ${{ needs.create-release.outputs.version }}"
            gh release upload ${{ needs.create-release.outputs.version }} \
              "$APPIMAGE_NAME" \
              --clobber

            echo "✅ Uploaded: $APPIMAGE_NAME"
          else
            echo "❌ ERROR: No AppImage file found!"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload build artifacts (backup)
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/
          retention-days: 3

  finalize-release:
    name: Finalize Release
    needs: [create-release, build-release]
    runs-on: ubuntu-latest

    steps:
      - name: Update release status
        run: |
          echo "🎉 All builds completed successfully!"
          echo ""
          echo "Release: ${{ needs.create-release.outputs.version }}"
          echo "Draft release created - review and publish at:"
          echo "https://github.com/${{ github.repository }}/releases"
