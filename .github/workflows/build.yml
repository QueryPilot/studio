name: Build Verification

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            platform: macos
            target: aarch64-apple-darwin
          - os: windows-latest
            platform: windows
            target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install macOS dependencies
        if: matrix.os == 'macos-latest'
        run: |
          brew install create-dmg

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libglib2.0-dev \
            libgtk-3-dev

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            src-tauri/target
            node_modules
          key: ${{ runner.os }}-build-${{ hashFiles('**/Cargo.lock', '**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build AI sidecar
        run: |
          echo "Building AI sidecar for ${{ matrix.target }}..."
          pnpm build:ai-sidecar

          # Verify the sidecar was built
          echo "Checking for built sidecar..."
          ls -la src-tauri/sidecars/ || echo "Sidecars directory not found!"

          # Show what Tauri is looking for
          if [ "${{ matrix.platform }}" = "windows" ]; then
            EXPECTED_FILE="src-tauri/sidecars/ai-server-${{ matrix.target }}.exe"
          else
            EXPECTED_FILE="src-tauri/sidecars/ai-server-${{ matrix.target }}"
          fi

          echo "Tauri expects: $EXPECTED_FILE"

          if [ ! -f "$EXPECTED_FILE" ]; then
            echo "ERROR: Sidecar binary not found!"
            exit 1
          fi

          echo "✅ Sidecar built successfully"
        shell: bash

      - name: Build Tauri app
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: pnpm tauri:build

      - name: Build Summary
        if: always()
        run: |
          echo "## 🚀 Build Results - ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ AI Sidecar built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tauri app built successfully" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** ${{ matrix.platform }}" >> $GITHUB_STEP_SUMMARY
          echo "**Target:** ${{ matrix.target }}" >> $GITHUB_STEP_SUMMARY
        shell: bash

      # Only upload artifacts on release events (optional)
      - name: Upload artifacts
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
