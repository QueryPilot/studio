[package]
name = "query-pilot"
version = "0.11.0"
edition = "2021"
default-run = "query-pilot"

[build-dependencies]
tauri-build = { version = "2.5", features = [] }

[dependencies]
# Tauri
tauri = { version = "2.10", features = [ "macos-private-api"] }
tauri-plugin-shell = "2.3"
tauri-plugin-opener = "2.5"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-dialog = "2.4"
tauri-plugin-fs = "2.4"
tauri-plugin-window-state = "2.4"
tauri-plugin-updater = "2.9"
tauri-plugin-process = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"  # MessagePack for binary serialization (faster & smaller than JSON)
rmp = "0.8"  # Low-level MessagePack encoding for direct Row→MsgPack
# serde_bytes no longer needed - using Response::new() for raw binary transfer
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
argon2 = { version = "0.5", default-features = false, features = ["std"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
deadpool-postgres = "0.14"

# PostgreSQL
tokio-postgres = { version = "0.7", features = [
    "with-serde_json-1",
    "with-uuid-1",
    "with-chrono-0_4",
    "with-bit-vec-0_6",
    "with-time-0_3"
] }
postgres-types = { version = "0.2", features = ["derive", "with-serde_json-1"] }
postgres-protocol = "0.6"
native-tls = "0.2"
postgres-native-tls = "0.5"

# MySQL
mysql_async = "0.34"

# SQLite
rusqlite = { version = "0.31", features = ["bundled", "chrono", "serde_json", "backup", "column_decltype"] }

# SQL Server (TDS protocol)
tiberius = { version = "0.12", default-features = false, features = ["rustls", "chrono"] }
bb8 = "0.8"
bb8-tiberius = "0.15"

# Document DB (MongoDB)
mongodb = "3.4"
bson = "2.11"

# Key-Value DB (Redis)
fred = { version = "10.1", features = ["sentinel-client", "replicas", "i-scripts"] }

# Data types
fallible-iterator = "0.2"
bytes = "1"
uuid = { version = "1.6", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.33", features = ["db-postgres", "serde"] }
bit-vec = "0.6"
time = { version = "0.3", features = ["serde"] }
base64 = "0.21"

# SQL Parsing
sqlparser = { version = "0.52", features = ["serde"] }

# ACP (Agent Client Protocol)
agent-client-protocol = { version = "0.9", features = ["unstable_session_model"] }  # ACP protocol with model selection
which = "7.0"                   # Agent binary detection in PATH
piper = "0.2"                   # In-memory pipes with futures traits for ACP

# Utilities
dashmap = "5.5"
once_cell = "1.19"  # Lazy static initialization for global schema store
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
dirs = "5.0"
rayon = "1.8"  # Parallel processing for row conversion
moka = { version = "0.12", features = ["sync"] }  # LRU cache for prepared statements
bumpalo = { version = "3.14", features = ["collections"] }  # Arena allocator for batch encoding
ryu = "1.0"  # Fast float-to-string conversion
itoa = "1.0"  # Fast integer-to-string conversion

# SSH
ssh2 = { version = "0.9.5", features = ["vendored-openssl"] }  # Primary SSH library with libssh2 v1.11.1 (supports modern key types)
ssh_config = "0.1.0"  # For parsing ~/.ssh/config
shellexpand = "3.1"  # For expanding ~ in paths

# Security
keyring = { version = "3.3", features = ["apple-native", "windows-native", "linux-native"] }
rand = "0.8"
zeroize = "1.7"
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand_core = "0.6"
tauri-plugin-os = "2.3"

# Telemetry (optional, enabled via telemetry feature flag)
sentry = { version = "0.34", optional = true, default-features = false, features = ["backtrace", "contexts", "panic", "rustls"] }
sentry-tracing = { version = "0.34", optional = true }
tauri-plugin-deep-link = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
telemetry = ["sentry", "sentry-tracing"]

[dev-dependencies]
pretty_assertions = "1.4"
rmpv = "1.3"  # MessagePack Value type for test decoding

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2.4"
