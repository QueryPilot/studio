[package]
name = "devdb-studio"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-window-state = "2"
tauri-plugin-updater = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1.3"  # MessagePack for binary serialization (faster & smaller than JSON)
# serde_bytes no longer needed - using Response::new() for raw binary transfer
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
argon2 = { version = "0.5", default-features = false, features = ["std"] }

# Async runtime
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
deadpool-postgres = "0.14"

# PostgreSQL
tokio-postgres = { version = "0.7", features = [
    "with-serde_json-1",
    "with-uuid-1",
    "with-chrono-0_4",
    "with-bit-vec-0_6",
    "with-time-0_3"
] }
postgres-types = { version = "0.2", features = ["derive", "with-serde_json-1"] }
postgres-protocol = "0.6"
native-tls = "0.2"
postgres-native-tls = "0.5"

# Data types
uuid = { version = "1.6", features = ["serde", "v4"] }
chrono = { version = "0.4", features = ["serde"] }
bigdecimal = { version = "0.4", features = ["serde"] }
rust_decimal = { version = "1.33", features = ["db-postgres", "serde"] }
bit-vec = "0.6"
time = { version = "0.3", features = ["serde"] }
base64 = "0.21"

# Utilities
dashmap = "5.5"
thiserror = "1.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1.10"
dirs = "5.0"
rayon = "1.8"  # Parallel processing for row conversion
moka = { version = "0.12", features = ["sync"] }  # LRU cache for prepared statements

# Security
keyring = { version = "3.3", features = ["apple-native", "windows-native", "linux-native"] }
rand = "0.8"
zeroize = "1.7"
chacha20poly1305 = { version = "0.10", features = ["std"] }
rand_core = "0.6"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
pretty_assertions = "1.4"
